name: Build & deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # evenings (Vietnam): the build takes each match's last referee "Chốt" into the schedule and standings
    - cron: "*/15 10-16 * * *"  # every 15 min, 17:00–23:59 Vietnam: a referee "Chốt" reaches the schedule and standings within minutes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
