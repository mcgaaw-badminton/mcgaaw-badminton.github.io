name: Build & deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 20:05 Vietnam time every Wednesday (match days): standings pick up the referees' official scores
    - cron: "5 13 * * 3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
