<script>try { var t = localStorage.getItem('gcl-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<div class="app">
  <!-- one bar for every screen: back, title, timer, save status -->
  <header class="bar">
    <button type="button" class="back" id="back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backTxt">Quay lại</span></button>
    <a class="home" id="home" href="./" aria-label="Về trang giải"><img src="{{LOGO}}" alt="" width="30" height="30"></a>
    <span class="title" id="title">Trọng tài</span>
    <span class="demo-tag">DEMO</span>
    <span class="clock" id="clock" hidden>00:00</span>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Chuyển nền sáng / tối"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button type="button" class="sync" id="sync" aria-live="polite"><i></i><span id="syncTxt"></span></button>
  </header>

  <!-- 1. matches -->
  <section class="scr" id="scrList">
    <h1>Chế độ</h1>
    <div class="mode" id="modePick" role="group" aria-label="Chế độ ghi điểm"></div>
    <h1>Chọn trận</h1>
    <div class="list" id="mlist"></div>
  </section>

  <!-- 2. the 5 pairs of a match -->
  <section class="scr" id="scrPairs" hidden>
    <h1 id="pairsTitle"></h1>
    <div class="list" id="plist"></div>
    <div class="finalbox" id="pairFinal"></div>
    <button type="button" class="big ghost" id="toSum">Tổng kết trận</button>
  </section>

  <!-- 3. positions: must be set before scoring -->
  <section class="scr" id="scrSetup" hidden>
    <div class="court-wrap"><div class="court" id="setupCourt"></div><div class="court-foot teams" id="teamFoot"></div></div>
    <p class="muted drag-hint">Kéo người vào ô, chạm để đổi trước ↔ sau · kéo thẻ đội sang bên kia để đổi sân.</p>
    <div class="step" id="step3">
      <h2>Đội nào giao cầu trước?</h2>
      <div class="choice" id="pickServe"></div>
    </div>
    <p class="warn" id="setupWarn" hidden>Đã có điểm: đổi vị trí chỉ tính lại chỗ đứng, điểm giữ nguyên.</p>
    <button type="button" class="big pri" id="startBtn" disabled>Bắt đầu tính điểm</button>
    <button type="button" class="big danger" id="resetBtn" hidden>Đặt lại cặp này (về 0, chưa đấu)</button>
  </section>

  <!-- 4. scoring -->
  <section class="scr" id="scrPlay" hidden>
    <div class="board"><div class="bt s-l" id="bL"></div><p class="call" id="call" aria-live="polite"></p><div class="bt s-r" id="bR"></div></div>
    <div class="court-wrap"><div class="court big" id="playCourt"></div><div class="court-foot" aria-hidden="true"><span class="cf l"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Trái</span><span class="ref-me" title="Chỗ trọng tài đứng"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c0-4 3.1-7 7-7s7 3 7 7"/></svg>Trọng tài</span><span class="cf r">Phải<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span></div></div>
    <p class="hint" id="endedNote" hidden>Đã đủ 31 điểm · <button type="button" class="link" id="seeResult">xem kết quả</button></p>
    <div class="acts">
      <button type="button" class="act" id="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Hoàn tác</button>
      <button type="button" class="act" id="toLog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Các điểm</button>
      <button type="button" class="act" id="resetPlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Đặt lại</button>
      <button type="button" class="act stop" id="endBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Kết thúc</button>
    </div>
  </section>

  <!-- 5. pair finished: saved + checked on the sheet -->
  <section class="scr" id="scrEnd" hidden>
    <div class="result" id="result"></div>
    <div class="submit" id="submit"></div>
    <button type="button" class="big pri" id="nextBtn"></button>
    <button type="button" class="big ghost" id="resumeBtn">Quay lại tính tiếp</button>
  </section>

  <!-- rally list, editable -->
  <section class="scr" id="scrLog" hidden>
    <h1>Các điểm đã ghi</h1>
    <p class="muted">Chạm một điểm để sửa hoặc xóa.</p>
    <ol class="log" id="log"></ol>
  </section>

  <!-- match summary -->
  <section class="scr" id="scrSum" hidden>
    <div id="sum"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden><span id="toastTxt"></span><button type="button" id="toastUndo">Hoàn tác</button></div>
  <div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2><div id="sheetBody"></div><div class="sheet-act" id="sheetAct"></div>
  </div></div>
</div>
